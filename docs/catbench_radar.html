<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>catbench — Model Radar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #101318;
    color: #e0e6f0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 24px 32px 16px;
    border-bottom: 1px solid #1e242e;
  }
  header h1 { font-size: 1.4rem; font-weight: 700; color: #fff; letter-spacing: 0.03em; }
  header p { font-size: 0.78rem; color: #6b7a94; margin-top: 4px; }
  .controls {
    display: flex;
    gap: 12px;
    padding: 14px 32px;
    align-items: center;
    flex-wrap: wrap;
    border-bottom: 1px solid #1e242e;
  }
  .controls input {
    background: #171b20;
    border: 1px solid #2a3040;
    border-radius: 6px;
    color: #e0e6f0;
    padding: 6px 12px;
    font-size: 0.82rem;
    width: 220px;
    outline: none;
  }
  .controls input:focus { border-color: #3188e8; }
  .controls select {
    background: #171b20;
    border: 1px solid #2a3040;
    border-radius: 6px;
    color: #e0e6f0;
    padding: 6px 10px;
    font-size: 0.82rem;
    outline: none;
    cursor: pointer;
  }
  .controls label { font-size: 0.78rem; color: #6b7a94; }
  .count { font-size: 0.78rem; color: #4a5568; margin-left: auto; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
    padding: 20px 32px 40px;
  }
  .card {
    background: #171b20;
    border: 1px solid #1e242e;
    border-radius: 10px;
    padding: 14px 12px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: border-color 0.15s;
  }
  .card:hover { border-color: #2d4a6e; }
  .card-title {
    font-size: 0.72rem;
    font-weight: 600;
    color: #aec0d8;
    text-align: center;
    margin-bottom: 2px;
    word-break: break-all;
    line-height: 1.3;
    max-width: 190px;
  }
  .card-score {
    font-size: 0.65rem;
    color: #3188e8;
    margin-bottom: 8px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  canvas { display: block; }
  .no-results, .loading {
    grid-column: 1/-1;
    text-align: center;
    color: #4a5568;
    padding: 60px 0;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<header>
  <h1>catbench · Model Radar</h1>
  <p id="subtitle">laden…</p>
</header>

<div class="controls">
  <label>Filter:</label>
  <input type="text" id="search" placeholder="model name…" oninput="render()">
  <label>Sort:</label>
  <select id="sort" onchange="render()">
    <option value="mean-desc">Mean ↓</option>
    <option value="mean-asc">Mean ↑</option>
    <option value="name-asc">Name A–Z</option>
    <option value="cyber-desc">Cybersecurity ↓</option>
    <option value="pentest-desc">Pentest ↓</option>
    <option value="coding-desc">Coding ↓</option>
  </select>
  <span class="count" id="count"></span>
</div>

<div class="grid" id="grid"><div class="loading">Laden…</div></div>

<script>
let TRACKS = [];
let TRACK_SHORT_MAP = {
  coding:'COD', cybersecurity:'CYB', daily:'DAY', dutch:'NL',
  hard:'HARD', honesty:'HON', longcontext:'LC', pentest:'PEN',
  reasoning:'RSN', scenario:'SCN', secdev:'SEC', standard:'STD', tools:'TOOL'
};
let MODELS = [];

function mean(scores) {
  const vals = TRACKS.map(t => scores[t]).filter(v => v !== null && v !== undefined);
  return vals.length ? vals.reduce((a,b) => a+b, 0) / vals.length : 0;
}

function sortModels(models) {
  const s = document.getElementById('sort').value;
  return [...models].sort((a,b) => {
    if (s === 'mean-desc') return b.mean - a.mean;
    if (s === 'mean-asc') return a.mean - b.mean;
    if (s === 'name-asc') return a.name.localeCompare(b.name);
    if (s === 'cyber-desc') return (b.scores.cybersecurity||0)-(a.scores.cybersecurity||0);
    if (s === 'pentest-desc') return (b.scores.pentest||0)-(a.scores.pentest||0);
    if (s === 'coding-desc') return (b.scores.coding||0)-(a.scores.coding||0);
    return 0;
  });
}

function drawRadar(canvas, scores) {
  const size = 160;
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const cx = size/2, cy = size/2;
  const R = size/2 - 20;
  const N = TRACKS.length;
  const step = (Math.PI*2)/N;
  const offset = -Math.PI/2;

  ctx.strokeStyle = '#1e242e';
  ctx.lineWidth = 0.8;
  for (let r = 1; r <= 4; r++) {
    ctx.beginPath();
    for (let i = 0; i < N; i++) {
      const angle = offset + i*step;
      const x = cx + Math.cos(angle)*(R*r/4);
      const y = cy + Math.sin(angle)*(R*r/4);
      i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.stroke();
  }

  ctx.strokeStyle = '#1e242e';
  for (let i = 0; i < N; i++) {
    const angle = offset + i*step;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(angle)*R, cy + Math.sin(angle)*R);
    ctx.stroke();
  }

  const pts = TRACKS.map((t,i) => {
    const v = scores[t] !== null && scores[t] !== undefined ? scores[t] : 0;
    const angle = offset + i*step;
    return [cx + Math.cos(angle)*R*v, cy + Math.sin(angle)*R*v];
  });

  ctx.beginPath();
  pts.forEach(([x,y], i) => i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y));
  ctx.closePath();
  ctx.fillStyle = 'rgba(49,136,232,0.22)';
  ctx.fill();
  ctx.strokeStyle = '#3188e8';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  ctx.fillStyle = '#3188e8';
  pts.forEach(([x,y]) => {
    ctx.beginPath();
    ctx.arc(x,y,2.2,0,Math.PI*2);
    ctx.fill();
  });

  ctx.fillStyle = '#5a6a84';
  ctx.font = '8px system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < N; i++) {
    const angle = offset + i*step;
    const lx = cx + Math.cos(angle)*(R+11);
    const ly = cy + Math.sin(angle)*(R+11);
    ctx.fillText(TRACK_SHORT_MAP[TRACKS[i]] || TRACKS[i].substring(0,4).toUpperCase(), lx, ly);
  }
}

function displayName(name) {
  if (name.startsWith('hf.co/')) {
    const inner = name.replace('hf.co/','');
    const parts = inner.split('/');
    const model = parts.slice(1).join('/').replace(/-GGUF.*$/,'').replace(/:.*$/,'');
    return model.length > 28 ? model.substring(0,26)+'…' : model;
  }
  return name;
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = sortModels(MODELS.filter(m => m.name.toLowerCase().includes(q)));
  document.getElementById('count').textContent = `${filtered.length} / ${MODELS.length} models`;
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  if (!filtered.length) {
    grid.innerHTML = '<div class="no-results">Geen modellen gevonden</div>';
    return;
  }
  filtered.forEach(m => {
    const card = document.createElement('div');
    card.className = 'card';
    const title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = displayName(m.name);
    title.title = m.name;
    const scoreEl = document.createElement('div');
    scoreEl.className = 'card-score';
    scoreEl.textContent = `avg ${(m.mean*100).toFixed(1)}`;
    const canvas = document.createElement('canvas');
    card.appendChild(title);
    card.appendChild(scoreEl);
    card.appendChild(canvas);
    grid.appendChild(card);
    drawRadar(canvas, m.scores);
  });
}

async function init() {
  let data;
  try {
    const res = await fetch('results.json');
    data = await res.json();
  } catch(e) {
    document.getElementById('grid').innerHTML = '<div class="no-results">Kan results.json niet laden</div>';
    return;
  }

  TRACKS = data.tracks || [];
  const runId = data.run || '';

  MODELS = Object.entries(data.models || {}).map(([name, trackData]) => {
    const scores = {};
    TRACKS.forEach(t => {
      scores[t] = trackData[t] ? trackData[t].mean : null;
    });
    return { name, scores, mean: mean(scores) };
  });

  document.getElementById('subtitle').textContent =
    `${runId} · ${TRACKS.length} tracks · 0–100 schaal`;

  render();
}

init();
</script>
</body>
</html>
